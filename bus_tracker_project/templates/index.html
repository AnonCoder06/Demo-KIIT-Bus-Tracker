<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KIIT Bus Tracker</title>


    <!-- =====================================================
         LEAFLET CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <!-- =====================================================
         APPLICATION CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="top-bar">

        <div class="header-content">

            <div>
                <h1>KIIT Bus Tracker</h1>

                <p>
                    Real-time campus bus tracking
                </p>
            </div>


            <a
                href="/sender"
                class="sender-button"
            >
                GPS Sender
            </a>

        </div>

    </header>


    <!-- =====================================================
         MAP
         ===================================================== -->

    <main>

        <div id="map"></div>

    </main>


    <!-- =====================================================
         LEAFLET JAVASCRIPT
         ===================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <!-- =====================================================
         APPLICATION JAVASCRIPT
         ===================================================== -->

    <script
        src="{{ url_for('static', filename='js/map.js') }}"
    ></script>

</body>

</html>
